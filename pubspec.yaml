name: liveness_kit
description: >-
  Gesture-based face liveness check for Flutter: head-turn challenges, a
  still at the end, and native face detection with no Firebase or ML Kit.
version: 0.1.0
repository: https://github.com/Universal-Weblinks/liveness-kit
issue_tracker: https://github.com/Universal-Weblinks/liveness-kit/issues

topics:
  - liveness
  - kyc
  - face-detection
  - camera
  - biometrics

environment:
  sdk: ^3.9.2
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.universalweblinks.liveness_kit
        pluginClass: LivenessKitPlugin
      ios:
        pluginClass: LivenessKitPlugin
